[build]
  publish = "dist"
  command = "npm run build"

# Headers per ottimizzazione performance e security
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Font caching (1 anno - i font non cambiano spesso)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Immagini WebP (1 mese)
[[headers]]
  for = "/images/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
    Content-Type = "image/webp"

# JavaScript e CSS (1 anno per file con hash)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML (no cache - sempre fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JSON data (1 ora)
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/json; charset=utf-8"

# Compressione automatica
[[headers]]
  for = "/*"
  [headers.values]
    # Brotli compression (automatico su Netlify per text files)
    Accept-Encoding = "br, gzip, deflate"

# Redirect rules (se necessario)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = false

# Asset optimization (Netlify lo fa automaticamente, ma possiamo configurarlo)
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
